.event.kind-play{border-left:4px solid var(--blue);background:linear-gradient(90deg,rgba(36,109,140,.045),#fff 18%)}
.event.kind-transport{border-left:4px solid var(--red);background:linear-gradient(90deg,rgba(191,79,71,.05),#fff 18%)}
.event.kind-food{border-left:4px solid var(--orange);background:linear-gradient(90deg,rgba(221,121,56,.055),#fff 18%)}
.event.kind-hotel{border-left:4px solid var(--teal);background:linear-gradient(90deg,rgba(33,120,111,.05),#fff 18%)}

.event.kind-transport .event-kind{background:#fde3df;color:#96342e;border-color:#f2c8c3}

.event.kind-booking .event-kind{background:#ece8f7;color:#594b82;border-color:#dcd4ed}
.event.kind-procedure .event-kind{background:#edf0f1;color:#4f6571;border-color:#d6dee1}

@media(max-width:760px){.time-row{gap:8px}.time-row .duration{margin-left:0}.event-kind{font-size:11px;padding:4px 8px}.event{padding-left:15px}}
@media(max-width:760px){.ticket-grid{grid-template-columns:1fr}.food-backup-modal{padding:10px;align-items:flex-end}.food-backup-dialog{max-height:88vh;border-radius:20px 20px 14px 14px}.food-backup-head{padding:16px}.food-backup-body{padding:14px 16px 18px}.food-backup-btn{padding:9px 14px;font-size:13px}}
`;
  src = src.replace('</style>', extraCss + '</style>');
  src = src.replace('<a href="#pre">订票准备</a><a href="#map">路线地图</a>', '<a href="#tickets">票务速查</a><a href="#pre">订票准备</a><a href="#map">路线地图</a>');

  const ticketHub = `
<section class="ticket-hub" id="tickets">
  <div class="section-title"><h2>票务速查｜现场第一时间怎么找到</h2><p>公开网页只写 Gmail 关键字，不保存预约号、护照号或 QR Code</p></div>

    <div class="ticket-card done"><h3>9/20–9/21 小琉球往返船票 <span class="status-ok">已买</span></h3><p><b>Gmail 搜：</b></p><div class="mailkey">请立即查收KKday订购确认凭证</div><p class="action">怎么用：KKday「免换票」东琉线往返票。现场打开凭证 QR Code，按工作人员指引验票登船。</p><p>去程9/20、回程9/21使用同一份往返凭证；护照随身带着。建议目标船班前至少30分钟到码头。</p></div>
    <div class="ticket-card done"><h3>9/25 阿里山→祝山观日列车 <span class="status-ok">已买</span></h3><p><b>Gmail 搜：</b></p><div class="mailkey">阿里山林鐵網路訂票付款成功通知</div><p class="action">9/24 到阿里山后去阿里山车站窗口，带订票时使用的护照原件取票。</p><p>车票非对号座；9/24 下午约16:30后再次确认9/25最终发车时间。</p></div>

  </div>

  src = src.replace('<section class="booking" id="pre">', ticketHub + '\n<section class="booking" id="pre">');
  src = src.replace('<div class="section-title"><h2>出发前订票顺序</h2><p>公共交通可直接执行，共乘接驳需另行预约</p></div>', '<div class="section-title"><h2>出发前订票顺序</h2><p>已买票看上方速查；9127D必须到台湾线下处理</p></div>');

  src = src.replace('<div class="book-item"><b>④ 9/21公共交通</b><span>东琉线码头→9127D→左营→高铁台南→H31小西门→步行到烟波。</span></div>', '<div class="book-item important"><b>④ ⚠️ 9/21 9127D｜未购票・线下处理</b><span>目标12:13东琉线码头→13:03左营；若满员，下一班12:43→13:33。优先在9/20左营柜台询问能否一并处理回程。</span></div>');
  src = src.replace('<div class="book-item"><b>⑦ 9/24、9/25山线公交</b><span>9/24隙顶上阿里山；9/25阿里山到高铁嘉义站，按网页时刻执行。</span></div>', '<div class="book-item"><b>⑦ 9/24、9/25山线公交</b><span>9/24隙顶上阿里山改为A线＋B线并行候车，有位就上；9/25 10:10阿里山→高铁嘉义已购票。</span></div>');

  const timelinePatches = [
    ['<div class="fallback"><b>08:30满员或没赶上：</b>立即向柜台确认下一班可搭班次，不要自己猜时刻；若等待会影响船班，直接改Uber/计程车去东港。<span class="freq">现场确认</span></div>','<div class="fallback"><b>08:30满员或没赶上：</b>优先改搭09:00左营发、约10:00到东琉线码头；到码头后直接排后续可搭船班。只有下一班也会明显压缩当天活动时，再改Uber/计程车去东港。<span class="freq">下一班约30分钟</span></div>'],
    ['海月靠近白沙港。先寄存行李，再完成电动车说明和安全检查；确认第二天退房后能否继续寄存。','海月靠近白沙港。先寄存行李，再完成电动车说明和安全检查；取车前必须确认车型（电动机车／电动自行车）、外国旅客证件或驾照要求、是否允许双载；若不能双载就两人各一辆。并确认第二天退房后能否继续寄存。'],
    ['<div class="fallback"><b>12:13无位或错过：</b>现场问下一班可搭时间；若等待过久，直接改叫Uber/计程车从东港去台南。<span class="freq">现场确认</span><br>H31为市区接驳，不需要现在预订。</div>','<div class="fallback"><b>12:13无位或错过：</b>下一班12:43从东琉线码头发、13:33到左营；再下一班13:13→14:03。若只能搭13:13以后班次，优先取消当日下午赤崁楼，或直接改Uber/计程车去台南。<span class="freq">30分钟 / 30分钟</span><br>H31为市区接驳，不需要现在预订。</div>'],
    ['优先走主要观景段，不强求完整步道；17:10前到日落视野较好的位置。','优先走主要观景段，不强求完整步道；17:10前到日落视野较好的位置。出发前向十方山水确认日落后返程步行路线是否合适、是否可协助接送；手机照明和电量要留足。'],
    ['<h2>隙顶 → 阿里山｜台湾好行A线</h2><p>不包车。核心是带着行李赶上10:50左右经过隙顶的公交。</p>','<h2>隙顶 → 阿里山｜台湾好行A线＋B线</h2><p>不包车。核心是提早到隙顶站，同时看A/B线动态；中途站不能预约，有位的车先上，不死等10:50 A线。</p>'],
    ['<article class="event transport"><div class="time-row"><div class="time">09:40–10:20</div><span class="duration">民宿短接驳</span></div><h3>十方山水 → 隙顶公交站</h3><p>提前请民宿送到“隙顶”站，至少提前20分钟候车。不要拖着行李临时走山路找站牌。</p>','<article class="event transport"><div class="time-row"><div class="time">09:15–09:35</div><span class="duration">民宿短接驳</span></div><h3>十方山水 → 隙顶公交站</h3><p>前一晚请民宿确认09:15左右出发，目标09:35前到“隙顶”站。这样10:00左右经过的A/B线能上就直接上；不要拖着行李临时走山路找站牌。</p>'],
    ['<article class="event transport"><div class="time-row"><div class="time">10:50–12:00</div><span class="duration">台湾好行7329 A线</span></div><h3>隙顶 → 阿里山转运站</h3><p>目标搭09:30从高铁嘉义站始发、约10:50经过隙顶、12:00抵达阿里山的班次。可刷悠游卡／一卡通。</p><div class="critical">中途站不能预约座位，始发站乘客优先；连假前一天可能客满。请民宿协助确认站点与当天公车动态。</div><div class="fallback"><b>没上到10:50班次：</b>下一班约11:30经过隙顶、12:40到阿里山；再下一班约12:20经过，14:05到阿里山。<span class="freq">40分钟 / 50分钟</span><br>改搭11:30时仍能完成森林主路线；改搭12:20时取消沼平线，改走住宿区附近短路线。</div></article>','<article class="event transport"><div class="time-row"><div class="time">09:35–12:40</div><span class="duration">A/B线谁先有位就上</span></div><h3>隙顶 → 阿里山转运站</h3><p>中途站不能预约座位。到站后同时看A线与B线动态，优先尝试10:00左右A/B线；没上到就依次看10:30 B线、10:50 A线、11:00 B线、11:30 A/B线。可刷悠游卡／一卡通。</p><div class="critical">9/24是连假前一天，而且你们带行李。现场原则只有一个：有位就上，不要为了等10:50 A线放过更早的B线。</div><div class="fallback"><b>11:30仍没上到：</b>继续看12:20 A线或12:30 B线；预计13:40–14:05到阿里山。到这个时间就取消沼平线，改住宿区＋短步道。若连续多班客满，请十方山水协助联系当地车辆。<span class="freq">保底方案</span></div></article>'],
    ['<article class="event transport"><div class="time-row"><div class="time">约13:30–14:10</div><span class="duration">台湾高铁</span></div><h3>高铁嘉义 → 左营</h3><p>实际班次等9月时刻开放后选定。一般车程约30分钟，建议购买预留20分钟换乘缓冲的班次。</p><div class="fallback"><b>没赶上原高铁：</b>嘉义至左营白天通常有后续列车可改搭，等待成本多为约20–40分钟。<span class="freq">约20–40分钟</span></div></article>','<article class="event transport"><div class="time-row"><div class="time">14:14–14:45</div><span class="duration">高铁639次｜已购票</span></div><h3>高铁嘉义 → 左营</h3><p>7329 A线表定13:10到高铁嘉义站，预留约64分钟换乘。车次639，标准车厢，2张对号座；发车前完成取票并进闸。</p><div class="fallback"><b>巴士严重延误、赶不上14:14：</b>先到高铁柜台处理原票，再按现场可改搭班次调整；当天9/25港区行程直接取消，不再赶景点。<span class="freq">先保住转场</span></div></article>'],
    ['<article class="event transport"><div class="time-row"><div class="time">14:10–14:40</div><span class="duration">高雄捷运红线</span></div><h3>R16左营 → R10美丽岛</h3><p>往小港方向，Hotel Dùa靠近美丽岛站6号出口。</p><div class="fallback"><b>错过捷运：</b>白天约4–8分钟一班。<span class="freq">约4–8分钟</span></div></article>','<article class="event transport"><div class="time-row"><div class="time">15:00–15:25</div><span class="duration">高雄捷运红线</span></div><h3>R16左营 → R10美丽岛</h3><p>14:45高铁到左营后先出站、转捷运，再搭红线往小港方向；Hotel Dùa靠近美丽岛站6号出口。</p><div class="fallback"><b>错过捷运：</b>白天约4–8分钟一班。<span class="freq">约4–8分钟</span></div></article>'],
