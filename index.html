<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台湾南部旅行｜2026.09.19–09.27</title></head>
<body><div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;padding:28px">正在载入行程…</div>
<script>
fetch('./itinerary-base.html?merged=1').then(r=>r.text()).then(src=>{
  const extraCss = `
.ticket-hub{background:rgba(255,253,248,.97);border:1px solid rgba(60,75,85,.1);border-radius:22px;box-shadow:var(--shadow);padding:21px;margin-bottom:18px;scroll-margin-top:78px}
.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.ticket-card{padding:15px;border-radius:15px;background:#f6f3ec;border:1px solid #e3ddd2}.ticket-card.done{background:linear-gradient(135deg,#eef7f4,#fff);border-color:#cfe3dc}.ticket-card.pending{background:#fff0ed;border:2px solid #d85c52}.ticket-card h3{margin:0 0 8px;font-size:17px}.ticket-card p{margin:6px 0;font-size:13px}.mailkey{display:block;margin:6px 0 9px;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #dedbd3;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;word-break:break-word}.status-ok{display:inline-flex;margin-left:6px;padding:3px 8px;border-radius:999px;background:#d9eee7;color:#15594f;font-size:11px;font-weight:850}.status-failed{display:inline-flex;margin-left:6px;padding:3px 8px;border-radius:999px;background:#d94c43;color:#fff;font-size:11px;font-weight:850}.ticket-card .action{font-weight:750;color:#174d60}.ticket-card .privacy{color:#93452d}.important-ticket{margin-top:12px;padding:14px 15px;border-radius:14px;background:#fff0ed;border:2px solid #d85c52;font-size:14px}.important-ticket b{color:#a52f28;font-size:15px}.book-item.important{background:#fff0ed;border:2px solid #d85c52}.book-item.important b{color:#a52f28}@media(max-width:760px){.ticket-grid{grid-template-columns:1fr}}
`;
  src = src.replace('</style>', extraCss + '</style>');
  src = src.replace('<a href="#pre">订票准备</a><a href="#map">路线地图</a>', '<a href="#tickets">票务速查</a><a href="#pre">订票准备</a><a href="#map">路线地图</a>');

  const ticketHub = `
<section class="ticket-hub" id="tickets">
  <div class="section-title"><h2>票务速查｜现场第一时间怎么找到</h2><p>公开网页只写 Gmail 关键字，不保存预约号、护照号或 QR Code</p></div>
  <div class="ticket-grid">
    <div class="ticket-card done">
      <h3>9/20–9/21 小琉球往返船票 <span class="status-ok">已买</span></h3>
      <p><b>Gmail 搜：</b></p><div class="mailkey">请立即查收KKday订购确认凭证</div>
      <p class="action">怎么用：KKday「免换票」东琉线往返票。现场打开凭证 QR Code，按工作人员指引验票登船。</p>
      <p>9/20 去程、9/21 回程使用同一份往返凭证；护照随身带着。建议目标船班前至少30分钟到码头。</p>
    </div>
    <div class="ticket-card done">
      <h3>9/25 阿里山→祝山观日列车 <span class="status-ok">已买</span></h3>
      <p><b>Gmail 搜：</b></p><div class="mailkey">阿里山林鐵網路訂票付款成功通知</div>
      <p class="action">怎么取：按纸本票处理。9/24 到阿里山后去阿里山车站窗口，带订票时使用的护照原件取票。</p>
      <p>车票非对号座；9/24 下午约16:30后再次确认9/25最终发车时间。</p>
    </div>
    <div class="ticket-card done">
      <h3>9/25 阿里山→高铁嘉义 7329 A线 <span class="status-ok">已买</span></h3>
      <p><b>Gmail 搜：</b></p><div class="mailkey">阿里山EASY GO付款成功通知信</div>
      <p class="action">怎么上车：邮件里打开“憑證連結 / QRCode”。9/25 约09:50到阿里山转运站，打开二维码报到。</p>
      <p>班次：10:10 阿里山发。不要只找“订单成立通知信”，优先找“付款成功通知信”。</p>
    </div>
    <div class="ticket-card done">
      <h3>9/25 高铁嘉义→左营 <span class="status-ok">已买</span></h3>
      <p><b>Gmail 搜：</b></p><div class="mailkey">台灣高鐵網路訂票付款成功通知</div>
      <p class="action">车次：639｜嘉义14:14 → 左营14:45｜标准车厢｜2张对号座。</p>
      <p>到高铁嘉义站后，发车前完成取票；可用自助售票机/人工窗口，或 T Express。拿到票后按票面车厢与座位进闸。</p>
    </div>
    <div class="ticket-card pending">
      <h3>9/20、9/21 9127D <span class="status-failed">未买成</span></h3>
      <p><b>原因：</b>MAXA线上支付连续出现3D Secure验证失败。</p>
      <p class="action">9/20 到高铁左营站2号出口附近的大鹏湾琉球线/垦丁快线柜台线下处理。</p>
      <p>目标：9/20 08:30左营→东琉线码头；同时询问能否处理9/21 12:13东琉线码头→左营。没位就问下一班；时间不合适改 Uber/计程车。</p>
    </div>
    <div class="ticket-card pending">
      <h3>9/21 左营→台南高铁 <span class="status-failed">待购买</span></h3>
      <p>等9127D回程能否锁定后再买，避免班次接得过紧。高铁台南站→小西门的H31不用提前订票。</p>
    </div>
  </div>
</section>`;

  src = src.replace('<section class="booking" id="pre">', ticketHub + '\n<section class="booking" id="pre">');
  src = src.replace('<div class="section-title"><h2>出发前订票顺序</h2><p>公共交通可直接执行，共乘接驳需另行预约</p></div>', '<div class="section-title"><h2>出发前订票顺序</h2><p>已买票看上方速查；9127D必须到台湾线下处理</p></div>');
  src = src.replace('<div class="book-item"><b>② 9/20公共交通</b><span>Brio→R9中央公园→R16左营；左营2号出口柜台登记08:00的9127D，08:50到东琉线码头。</span></div>', '<div class="book-item important"><b>② ⚠️ 9/20 9127D｜未购票・到台湾线下买</b><span>Brio→R9中央公园→R16左营；到高铁左营站2号出口附近柜台现场购票/登记。目标08:30班次，建议至少提前40–50分钟到柜台。线上付款3D验证失败，不要误认为已有票。</span></div>');
  src = src.replace('<div class="book-item"><b>④ 9/21公共交通</b><span>东琉线码头→9127D→左营→高铁台南→H31小西门→步行到烟波。</span></div>', '<div class="book-item important"><b>④ ⚠️ 9/21 9127D｜未购票・线下处理</b><span>目标12:13东琉线码头→左营。优先在9/20左营柜台询问能否一并处理回程；若不能，9/21下船后尽早现场处理。之后接高铁台南＋H31小西门。</span></div>');
  src = src.replace('</main>\n<script>', '</main>\n<script>');
  document.open(); document.write(src); document.close();
}).catch(e=>{document.body.innerHTML='<div style="padding:30px;font-family:sans-serif"><h2>行程载入失败</h2><p>请刷新页面重试。</p></div>';console.error(e)});
</script></body></html>
