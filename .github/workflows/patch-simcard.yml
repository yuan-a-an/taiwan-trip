name: Patch Taiwan phone-number stop once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch itinerary
        run: python .github/patch-simcard.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add itinerary-base.html
          git diff --cached --quiet || git commit -m "Add Taiwan phone-number stop on Sep 21 [skip ci]"
          git push
